[package]
name = "dln-node"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
nostr-sdk = { git = "https://github.com/dukeh3/nostr.git", rev = "9ac9adc2" }
nwc = { git = "https://github.com/dukeh3/nostr.git", rev = "9ac9adc2" }
bip321 = { git = "https://github.com/DarkWebDivingClub/bip321.git", rev = "fcd4864" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ldk-node = { git = "https://gitlab.com/flowratehq/vls-signer/ldk-node.git", tag = "v0.7.0-flowrate.1" }
ldk-vls2-client = { git = "https://gitlab.com/flowratehq/vls-signer/vls-nostr-transport.git", tag = "v0.1.0", features = ["nostr_transport"] }
ldk-vls2-signer = { git = "https://gitlab.com/flowratehq/vls-signer/vls-nostr-transport.git", tag = "v0.1.0" }
lightning-signer = { git = "https://gitlab.com/flowratehq/vls-signer/validating-lightning-signer.git", tag = "v0.15.0-rc.1-flowrate.1", package = "vls-core" }

[dev-dependencies]
testcontainers = "0.27"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
